name: Desktop bundles

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-bundles-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test desktop and shared code
    # Fork pull requests keep a visible skipped record but never receive a runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Windows moved out to its own job (`bundle-windows`) because Authenticode
  # signing needs the `release` environment and a job can name only one.
  bundle:
    name: Bundle ${{ matrix.label }}
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'signing' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: ubuntu-22.04
            bundles: appimage
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux bundle dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - run: npm ci

      - name: Read app version
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          printf 'APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $APP_VERSION."
            exit 1
          fi

      - name: Write updater build config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOPOSAIC_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node scripts/write-updater-config.mjs \
            "$RUNNER_TEMP/toposaic-updater.json"

      - name: Build unsigned bundle
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: false

      - name: Build signed update bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          args: >-
            --bundles ${{ matrix.bundles }}
            --config ${{ runner.temp }}/toposaic-updater.json
          uploadWorkflowArtifacts: false

      - name: Stage Linux file
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(target/release/bundle/appimage/*.AppImage)
          if [[ "${#appimages[@]}" -ne 1 ]]; then
            echo "::error::Expected one AppImage, found ${#appimages[@]}."
            exit 1
          fi
          mkdir -p release-artifacts
          cp "${appimages[0]}" \
            "release-artifacts/TopoSaic-${APP_VERSION}-linux-${{ matrix.arch }}.AppImage"
          chmod +x \
            "release-artifacts/TopoSaic-${APP_VERSION}-linux-${{ matrix.arch }}.AppImage"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test -s "${appimages[0]}.sig"
            cp "${appimages[0]}.sig" \
              "release-artifacts/TopoSaic-${APP_VERSION}-linux-${{ matrix.arch }}.AppImage.sig"
          fi

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-linux-${{ matrix.arch }}.AppImage
          path: release-artifacts/*.AppImage
          if-no-files-found: error
          compression-level: 0

      - name: Upload Linux updater signature
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-linux-${{ matrix.arch }}.AppImage.sig
          path: release-artifacts/*.AppImage.sig
          if-no-files-found: error
          compression-level: 0

  bundle-windows:
    name: Bundle Windows
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    # Authenticode signing authenticates to Entra over OIDC against an exact
    # subject -- a classic federated credential cannot express `refs/tags/v*`
    # as a wildcard, hence binding to an environment rather than a ref. The
    # Entra app carries credentials for both `environment:release` and
    # `environment:signing`, so the job can sit in whichever environment holds
    # the other secrets it needs.
    #
    # A job may name only one environment, which is why Windows is no longer
    # part of the `bundle` matrix: Linux still needs `signing` for the updater
    # key. The three TAURI_* secrets must therefore also exist in `release`;
    # the guard in "Write updater build config" says so out loud if they do not.
    # `signing`, not `release`. A job sees only its own environment's secrets,
    # and TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD /
    # TAURI_UPDATER_PUBLIC_KEY live in `signing`. Running here in `release`
    # made those invisible, and the v0.8.1 tag failed at "Write updater build
    # config" before compiling anything.
    #
    # Azure authentication follows the job rather than the other way round:
    # the Entra app carries a federated credential bound to
    # `repo:theatrus/toposaic:environment:signing` as well as the `release`
    # one, so OIDC still matches from here.
    environment: >-
      ${{ (startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch') && 'signing' || '' }}
    runs-on: windows-latest
    permissions:
      contents: read
      # For the OIDC exchange with Entra. No Azure secret is stored in this
      # repository.
      id-token: write
    env:
      # Sign on tags -- what people download -- and on a manual dispatch, which
      # exists to exercise this path without cutting a release. Not on pull
      # requests or main pushes: nobody installs those artifacts, and every
      # signature spends the Basic tier's 5,000-a-month quota.
      #
      # The variable check keeps forks building, unsigned, instead of failing:
      # a fork has neither the variables nor access to the federated credential.
      SIGN_WINDOWS: >-
        ${{ (startsWith(github.ref, 'refs/tags/v') ||
        github.event_name == 'workflow_dispatch') &&
        vars.AZURE_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Read app version
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          printf 'APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $APP_VERSION."
            exit 1
          fi

      - name: Write updater build config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOPOSAIC_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" || -z "$TOPOSAIC_UPDATER_PUBLIC_KEY" ]]; then
            echo "::error::TAURI_UPDATER_PUBLIC_KEY, TAURI_SIGNING_PRIVATE_KEY and"
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD must exist in the"
            echo "::error::'release' environment as well as 'signing'. This job runs"
            echo "::error::in 'release' because the Entra federated credential is"
            echo "::error::bound to that environment, and a job sees only its own"
            echo "::error::environment's secrets."
            exit 1
          fi
          node scripts/write-updater-config.mjs \
            "$RUNNER_TEMP/toposaic-updater.json"

      # Windows builds in two passes so the executable can be signed before it
      # is packaged. Bundling in one pass would seal an unsigned program inside
      # a signed installer: the download looks fine, but toposaic-desktop.exe --
      # the thing a user actually runs afterwards -- would carry no publisher
      # identity, and enterprise unsigned-binary scans would flag it after
      # install.
      #
      # This replaces tauri-apps/tauri-action for Windows. The action builds and
      # bundles in one call, so it leaves no point between the two at which to
      # sign. Calling the CLI directly costs nothing here: the action's other
      # jobs -- installing toolchains and dependencies -- are already done by the
      # steps above, and artifact upload was switched off anyway.
      - name: Compile the desktop app, without bundling
        shell: bash
        run: |
          set -euo pipefail
          args=(--no-bundle)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--config "$RUNNER_TEMP/toposaic-updater.json")
          fi
          npm run tauri -- build "${args[@]}"

      - name: Verify Windows executable
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installation = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $installation) {
            throw "Could not find the Visual C++ build tools."
          }

          $dumpbin = Get-ChildItem "$installation\VC\Tools\MSVC" `
            -Filter dumpbin.exe -Recurse |
            Where-Object FullName -Match 'Hostx64\\x64\\dumpbin\.exe$' |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $dumpbin) {
            throw "Could not find dumpbin.exe."
          }

          $imports = & $dumpbin.FullName /DEPENDENTS `
            "target\release\toposaic-desktop.exe" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin could not inspect the Windows executable."
          }
          $imports
          if ($imports -Match '(?i)(VCRUNTIME|MSVCP|CONCRT).*\.dll') {
            throw "The Windows executable needs a Visual C++ Redistributable runtime."
          }

          $headers = & $dumpbin.FullName /HEADERS `
            "target\release\toposaic-desktop.exe" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin could not inspect the Windows executable headers."
          }
          $subsystem = [regex]::Match(
            $headers,
            '(?im)^\s*[0-9A-F.]+\s+subsystem\s+\((?<name>[^)]+)\)\s*$'
          )
          if (-not $subsystem.Success) {
            throw "Could not read the Windows executable subsystem."
          }
          $subsystem.Value
          if ($subsystem.Groups['name'].Value -ne 'Windows GUI') {
            throw "The Windows executable would open a console window."
          }

      # toposaic-desktop.exe is the only executable the installers carry: the
      # Sign through Tauri's own signCommand rather than signing the
      # executable ourselves beforehand.
      #
      # The obvious sequence -- sign target\release\toposaic-desktop.exe, then
      # bundle -- was tried first and does not work. Proven on psf-guard, which
      # has the same shape: `tauri bundle` rewrites the main executable as it
      # packages it, so the copy sealed inside the installer carries a
      # signature whose digest no longer matches (0x80096010). Confirmed there
      # with signtool on the runner and osslsigncode locally, and isolated by a
      # second binary from the same installer, unpacked by the same 7z, coming
      # out byte-identical and valid. Only the main executable is affected,
      # which is why the approach looks correct until you open the installer.
      #
      # signCommand is the right hook because Tauri invokes it on each artifact
      # at the moment it packages it -- after any rewriting, and again for the
      # installers themselves. Microsoft's action cannot be one, being an
      # action rather than a command. `dotnet sign` can, and authenticates
      # through DefaultAzureCredential, so no secret is stored here either.
      #
      # The --no-bundle split above now earns its keep for a different reason:
      # the OIDC client assertion lives five minutes and the compile takes far
      # longer, so compiling first keeps every Azure call within a couple of
      # minutes of this login.
      - name: Authenticate to Azure for code signing
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install dotnet sign
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-sign" --prerelease sign
          echo "SIGN_TOOL=$(cygpath -w "$RUNNER_TEMP/dotnet-sign/sign.exe")" >> "$GITHUB_ENV"

      # One config for the bundle step, whatever the trigger.
      #
      # The updater settings were previously passed only on tags, so a dry run
      # got no --config at all. That is fine while the config carries only
      # updater fields, but signCommand has to be present on every signed run
      # or the dry run silently produces unsigned installers -- the exact class
      # of quietly-wrong result this work exists to remove. So: start from the
      # updater config when there is one, add signCommand, and always pass the
      # result.
      #
      # The tool path is NOT quoted. Tauri splits signCommand on whitespace and
      # takes the first token as the program name, so quotes end up inside the
      # filename and bundling dies with os error 123, ERROR_INVALID_NAME.
      # RUNNER_TEMP contains no spaces, so quoting is unnecessary.
      - name: Build the bundling config
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        env:
          SIGNING_ENDPOINT: ${{ vars.SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/toposaic-bundle.json"
          src="$RUNNER_TEMP/toposaic-updater.json"
          node -e '
            const fs = require("fs");
            const [src, out] = process.argv.slice(1);
            const cfg = fs.existsSync(src) ? JSON.parse(fs.readFileSync(src, "utf8")) : {};
            cfg.bundle ??= {};
            cfg.bundle.windows ??= {};
            cfg.bundle.windows.signCommand =
              `${process.env.SIGN_TOOL} code artifact-signing`
              + ` --azure-credential-type azure-cli`
              + ` --artifact-signing-endpoint ${process.env.SIGNING_ENDPOINT}`
              + ` --artifact-signing-account ${process.env.SIGNING_ACCOUNT}`
              + ` --artifact-signing-certificate-profile ${process.env.SIGNING_PROFILE}`
              + ` --timestamp-url http://timestamp.acs.microsoft.com`
              + ` %1`;
            fs.writeFileSync(out, JSON.stringify(cfg, null, 2) + "\n");
            console.log(cfg.bundle.windows.signCommand);
          ' "$src" "$out"
          echo "BUNDLE_CONFIG=$out" >> "$GITHUB_ENV"

      # `tauri bundle` packages the already-compiled executable rather than
      # recompiling, and invokes signCommand on each artifact as it goes, so
      # the executable inside the installers and the installers themselves all
      # come out signed.
      - name: Bundle the Windows installers
        shell: bash
        env:
          # Tauri writes the updater .sig during bundling, so it needs the
          # updater key here and not merely when the config is written. The
          # step never carried these before, and never needed to: on a tag the
          # job used to fail earlier, at "Write updater build config", so
          # bundling was never reached with an updater config in hand. With
          # that fixed, bundling got as far as signing the installer with
          # Authenticode and then stopped on "A public key has been found, but
          # no private key".
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          args=(--bundles msi,nsis)
          # Fail loudly rather than letting Tauri emit an unsigned bundle if
          # the key is ever absent on a tag build.
          if [[ "$GITHUB_REF" == refs/tags/v* && -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is unset on a tag build;"
            echo "::error::the updater signature would be missing."
            exit 1
          fi
          if [[ -n "${BUNDLE_CONFIG:-}" ]]; then
            args+=(--config "$BUNDLE_CONFIG")
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=(--config "$RUNNER_TEMP/toposaic-updater.json")
          fi
          npm run tauri -- bundle "${args[@]}"

      # No separate installer-signing step: signCommand already signed them as
      # Tauri produced them. Signing again would spend quota twice and append a
      # second signature to files that already carry a valid one. If Tauri ever
      # stops invoking signCommand for installers, the verification below fails
      # rather than letting unsigned ones through.

      # The updater signature has to cover the signed installer. Tauri wrote a
      # .sig during bundling, over the bytes as they stood before Authenticode
      # touched them; that one is now stale and would make every installed copy
      # refuse the update. Write it again over the final file.
      - name: Sign the updater artifact again, over the signed installer
        if: >-
          env.SIGN_WINDOWS == 'true' &&
          startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(target/release/bundle/nsis/*.exe)
          test "${#exes[@]}" -eq 1
          rm -f "${exes[0]}.sig"
          npm run tauri -- signer sign "${exes[0]}"
          test -s "${exes[0]}.sig"

      # Without this the failure is invisible: a wrongly configured profile, or
      # an installer whose .sig covers the wrong bytes, leaves CI green and the
      # artifacts looking fine while every existing install quietly refuses to
      # update.
      - name: Verify Windows signatures
        if: env.SIGN_WINDOWS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          signtool=$(find "/c/Program Files (x86)/Windows Kits/10/bin" \
                       -name signtool.exe -path "*x64*" | sort | tail -1)
          echo "using: $signtool"

          exes=(target/release/bundle/nsis/*.exe)
          msis=(target/release/bundle/msi/*.msi)
          test "${#exes[@]}" -eq 1
          test "${#msis[@]}" -eq 1

          verify() {
            local file="$1"
            test -s "$file" || { echo "::error::Missing artifact $file."; exit 1; }
            echo "--- $file"
            "$signtool" verify //pa //v "$file" | tee "$RUNNER_TEMP/verify.txt"
            grep -q "StackFoundry LLC" "$RUNNER_TEMP/verify.txt" \
              || { echo "::error::Unexpected signing identity for $file."; exit 1; }
          }

          # What a person downloads.
          verify "${exes[0]}"
          verify "${msis[0]}"

          # And the program that actually ends up installed and run.
          #
          # Note this is NOT target/release/toposaic-desktop.exe. Under
          # signCommand, Tauri signs the copies it packages, so the loose build
          # output stays unsigned by design and checking it fails with "No
          # signature found" -- which is what an earlier version of this step
          # did. That loose file ships to nobody; the copy inside the installer
          # is the one that matters, and verifying the installer alone would
          # pass happily while shipping unsigned code within it.
          extract="$RUNNER_TEMP/nsis-contents"
          rm -rf "$extract"
          7z x -o"$extract" "${exes[0]}" > /dev/null
          inner=$(find "$extract" -iname "toposaic-desktop.exe" -print -quit)
          test -n "$inner" || {
            echo "::error::toposaic-desktop.exe was not found inside the installer."
            exit 1
          }
          echo "--- (inside installer) $inner"
          verify "$inner"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            test -s "${exes[0]}.sig" || {
              echo "::error::No updater signature for ${exes[0]}."
              exit 1
            }
            if [[ "${exes[0]}" -nt "${exes[0]}.sig" ]]; then
              echo "::error::The installer is newer than its .sig, so the .sig"
              echo "::error::covers pre-Authenticode bytes and updates would break."
              exit 1
            fi
          fi
          echo "OK: the NSIS installer, the MSI, and the executable inside them are signed as StackFoundry LLC."

      - name: Stage Windows files
        shell: pwsh
        run: |
          $msi = @(Get-ChildItem "target\release\bundle\msi" -Filter *.msi)
          $exe = @(Get-ChildItem "target\release\bundle\nsis" -Filter *.exe)
          if ($msi.Count -ne 1) {
            throw "Expected one MSI, found $($msi.Count)."
          }
          if ($exe.Count -ne 1) {
            throw "Expected one NSIS executable, found $($exe.Count)."
          }
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            $exeSig = Get-Item "$($exe[0].FullName).sig"
          }
          New-Item -ItemType Directory -Force "release-artifacts" | Out-Null
          Copy-Item $msi[0].FullName `
            "release-artifacts\TopoSaic-${env:APP_VERSION}-windows-x64.msi"
          Copy-Item $exe[0].FullName `
            "release-artifacts\TopoSaic-${env:APP_VERSION}-windows-x64.exe"
          if ($env:GITHUB_REF.StartsWith("refs/tags/")) {
            Copy-Item $exeSig.FullName `
              "release-artifacts\TopoSaic-${env:APP_VERSION}-windows-x64.exe.sig"
          }

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-windows-x64.msi
          path: release-artifacts/*.msi
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-windows-x64.exe
          path: release-artifacts/*.exe
          if-no-files-found: error
          compression-level: 0

      - name: Upload Windows updater signature
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-windows-x64.exe.sig
          path: release-artifacts/*.exe.sig
          if-no-files-found: error
          compression-level: 0

  bundle-macos-pr:
    name: Bundle macOS for pull request
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Read app version
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          printf 'APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Build ad-hoc macOS bundle
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: --bundles app,dmg
          uploadWorkflowArtifacts: false

      - name: Verify and stage macOS files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          app="target/release/bundle/macos/TopoSaic.app"
          dmgs=(target/release/bundle/dmg/*.dmg)
          test -d "$app"
          test "${#dmgs[@]}" -eq 1
          codesign --verify --deep --strict --verbose=4 "$app"
          hdiutil verify "${dmgs[0]}"
          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "release-artifacts/TopoSaic-${APP_VERSION}-macos-aarch64.app.zip"
          cp "${dmgs[0]}" \
            "release-artifacts/TopoSaic-${APP_VERSION}-macos-aarch64.dmg"

      - name: Upload macOS app archive
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-macos-aarch64.app.zip
          path: release-artifacts/*.app.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-macos-aarch64.dmg
          path: release-artifacts/*.dmg
          if-no-files-found: error
          compression-level: 0

  bundle-macos:
    name: Bundle signed and notarized macOS
    if: >-
      github.repository == 'theatrus/toposaic' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
      github.actor == 'theatrus' &&
      github.ref == 'refs/heads/main'))
    needs: test
    environment: signing
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - uses: dtolnay/rust-toolchain@1.97.1

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Read app version
        shell: bash
        run: |
          version=$(node -p 'require("./src-tauri/tauri.conf.json").version')
          printf 'APP_VERSION=%s\n' "$version" >> "$GITHUB_ENV"

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $APP_VERSION."
            exit 1
          fi

      - name: Write updater build config
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TOPOSAIC_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          node scripts/write-updater-config.mjs \
            "$RUNNER_TEMP/toposaic-updater.json"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_BUILD_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_BUILD_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$KEYCHAIN_PASSWORD"

          certificate_path="$RUNNER_TEMP/toposaic-certificate.p12"
          keychain_path="$RUNNER_TEMP/toposaic-signing.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 -D > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 7200 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          certificate_identity="$(
            security find-identity -v -p codesigning "$keychain_path" \
              | awk -F'"' '/Developer ID Application/ { print $2; exit }'
          )"
          test "$certificate_identity" = \
            "Developer ID Application: StackFoundry LLC (HSRHLHH333)"
          printf 'APPLE_SIGNING_IDENTITY=%s\n' "$certificate_identity" \
            >> "$GITHUB_ENV"

      - name: Install App Store Connect key
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PRIVATE: ${{ secrets.APPLE_API_KEY_PRIVATE }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$APPLE_API_ISSUER"
          test -n "$APPLE_API_KEY"
          test -n "$APPLE_API_KEY_PRIVATE"

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_PRIVATE" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          printf 'APPLE_API_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Build signed and notarized macOS bundle
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        with:
          tauriScript: npm run tauri
          args: --bundles app,dmg
          uploadWorkflowArtifacts: false

      - name: Build signed and notarized macOS update bundle
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npm run tauri
          args: >-
            --bundles app,dmg
            --config ${{ runner.temp }}/toposaic-updater.json
          uploadWorkflowArtifacts: false

      - name: Notarize and staple disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmgs=(target/release/bundle/dmg/*.dmg)
          test "${#dmgs[@]}" -eq 1
          xcrun notarytool submit "${dmgs[0]}" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait \
            --timeout 30m
          xcrun stapler staple "${dmgs[0]}"

      - name: Verify and stage signed macOS files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          app="target/release/bundle/macos/TopoSaic.app"
          dmgs=(target/release/bundle/dmg/*.dmg)
          test -d "$app"
          test "${#dmgs[@]}" -eq 1

          codesign --verify --deep --strict --verbose=4 "$app"
          codesign --verify --verbose=4 "${dmgs[0]}"
          xcrun stapler validate "$app"
          xcrun stapler validate "${dmgs[0]}"
          spctl --assess --type execute --verbose=4 "$app"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=4 \
            "${dmgs[0]}"
          hdiutil verify "${dmgs[0]}"

          mkdir -p release-artifacts
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "release-artifacts/TopoSaic-${APP_VERSION}-macos-aarch64.app.zip"
          cp "${dmgs[0]}" \
            "release-artifacts/TopoSaic-${APP_VERSION}-macos-aarch64.dmg"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            updater="target/release/bundle/macos/TopoSaic.app.tar.gz"
            test -s "$updater"
            test -s "$updater.sig"
            cp "$updater" \
              "release-artifacts/TopoSaic-${APP_VERSION}-macos-aarch64.app.tar.gz"
            cp "$updater.sig" \
              "release-artifacts/TopoSaic-${APP_VERSION}-macos-aarch64.app.tar.gz.sig"
          fi

      - name: Upload signed macOS app archive
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-macos-aarch64.app.zip
          path: release-artifacts/*.app.zip
          if-no-files-found: error
          compression-level: 0

      - name: Upload signed macOS disk image
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-macos-aarch64.dmg
          path: release-artifacts/*.dmg
          if-no-files-found: error
          compression-level: 0

      - name: Upload signed macOS updater
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: TopoSaic-${{ env.APP_VERSION }}-macos-aarch64-updater
          path: |
            release-artifacts/*.app.tar.gz
            release-artifacts/*.app.tar.gz.sig
          if-no-files-found: error
          compression-level: 0

      - name: Remove signing material
        if: always()
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        shell: bash
        run: |
          security delete-keychain \
            "$RUNNER_TEMP/toposaic-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/toposaic-certificate.p12"
          rm -f "$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, bundle, bundle-windows, bundle-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download installable files
        uses: actions/download-artifact@v8
        with:
          pattern: TopoSaic-*
          path: release-artifacts
          merge-multiple: true

      - name: Check release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          version="${GITHUB_REF_NAME#v}"
          required=(
            "TopoSaic-${version}-windows-x64.msi"
            "TopoSaic-${version}-windows-x64.exe"
            "TopoSaic-${version}-windows-x64.exe.sig"
            "TopoSaic-${version}-macos-aarch64.app.zip"
            "TopoSaic-${version}-macos-aarch64.dmg"
            "TopoSaic-${version}-macos-aarch64.app.tar.gz"
            "TopoSaic-${version}-macos-aarch64.app.tar.gz.sig"
            "TopoSaic-${version}-linux-x86_64.AppImage"
            "TopoSaic-${version}-linux-x86_64.AppImage.sig"
          )
          for file in "${required[@]}"; do
            if [[ ! -s "release-artifacts/$file" ]]; then
              echo "::error::Missing release file $file."
              exit 1
            fi
          done

      - name: Build release feeds
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          published_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          node scripts/release-feeds.mjs \
            release-artifacts \
            "$version" \
            "$GITHUB_REF_NAME" \
            "$published_at"
          node -e '
            for (const file of ["updater.json", "notice.json"]) {
              JSON.parse(require("node:fs").readFileSync(`release-artifacts/${file}`, "utf8"));
            }
          '

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          files=(release-artifacts/*)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            flags=(--verify-tag --generate-notes --title "TopoSaic $tag")
            if [[ "$tag" == *-* ]]; then
              flags+=(--prerelease)
            fi
            gh release create "$tag" "${files[@]}" "${flags[@]}"
          fi
